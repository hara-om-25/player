<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Плеєри ХАРА ОМ</title>
<meta name="theme-color" content="#151618">
<link rel="icon" href="icon-192.png">
<style>
@font-face { font-family: 'Tektur'; font-style: normal; font-weight: 400 900; font-display: swap;
  src: url(fonts/tektur-cyrillic-ext.woff2) format('woff2'); unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
@font-face { font-family: 'Tektur'; font-style: normal; font-weight: 400 900; font-display: swap;
  src: url(fonts/tektur-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Tektur'; font-style: normal; font-weight: 400 900; font-display: swap;
  src: url(fonts/tektur-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Tektur'; font-style: normal; font-weight: 400 900; font-display: swap;
  src: url(fonts/tektur-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root { --bg: #1a1b1d; --surface: #151618; --surf3: #252629; --accent: #ffd23f; --text: #f0f0f0; --dim: #bcbfc4; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Tektur', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px 16px; }
h1 { display: flex; align-items: center; gap: 12px; font-size: 26px; }
.logo { width: 40px; height: 40px; color: var(--accent); }
p { color: var(--dim); text-align: center; max-width: 520px; line-height: 1.4; }
.apps { display: grid; gap: 14px; width: min(520px, 100%); }
.apps a { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 12px; text-decoration: none;
  background: var(--surface); border: 1px solid var(--accent); color: var(--accent); font-size: 22px; font-weight: 700; }
.apps a small { display: block; color: var(--dim); font-size: 14px; font-weight: 400; margin-top: 4px; }
.apps a .ic { width: 64px; height: 64px; border-radius: 14px; flex: none; }
#ver { position: fixed; top: 10px; right: 14px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<h1><svg class="logo" viewBox="-39.83 -39.83 79.66 79.66" fill="currentColor" aria-hidden="true"><path d="M2.00 -4.83 L11.00 -13.83 L11.00 -39.83 L2.00 -30.83 Z M-2.00 -4.83 L-11.00 -13.83 L-11.00 -39.83 L-2.00 -30.83 Z M-4.83 -2.00 L-13.83 -11.00 L-39.83 -11.00 L-30.83 -2.00 Z M-4.83 2.00 L-13.83 11.00 L-39.83 11.00 L-30.83 2.00 Z M-2.00 4.83 L-11.00 13.83 L-11.00 39.83 L-2.00 30.83 Z M2.00 4.83 L11.00 13.83 L11.00 39.83 L2.00 30.83 Z M4.83 2.00 L13.83 11.00 L39.83 11.00 L30.83 2.00 Z M4.83 -2.00 L13.83 -11.00 L39.83 -11.00 L30.83 -2.00 Z M26.00 -33.50 L24.15 -28.55 L18.87 -28.32 L23.00 -25.03 L21.59 -19.93 L26.00 -22.85 L30.41 -19.93 L29.00 -25.03 L33.13 -28.32 L27.85 -28.55 Z"/></svg>Плеєри ХАРА ОМ</h1>
<p>Плеєр розділено на три окремі застосунки. Відкрийте потрібний і встановіть його (меню Chrome ⋮ → «Встановити застосунок»).</p>
<div class="apps">
  <a href="../audio-player/"><img class="ic" src="apps/audio-player.png" alt=""><span>Аудіоплеєр<small>мітки, фрагменти у MP3</small></span></a>
  <a href="../video-player/"><img class="ic" src="apps/video-player.png" alt=""><span>Відеоплеєр<small>мітки, покадрова прокрутка, «Останні»</small></span></a>
  <a href="../video-editor/"><img class="ic" src="apps/video-editor.png" alt=""><span>Відеоредактор<small>обрізка, фрагменти у відео та MP3</small></span></a>
</div>
<div id="ver"></div>
<script>
// Сторінка-меню на старій адресі /player/. APP_VER — щоб старий встановлений плеєр сам оновився сюди.
const APP_VER = 'v60';
document.getElementById('ver').textContent = APP_VER;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
